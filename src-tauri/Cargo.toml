[package]
name = "snappress"
version = "0.1.2"
description = "SnapPress - Screenpresso-style capture, scrolling capture and recording studio"
edition = "2021"
rust-version = "1.77"

[lib]
name = "snappress_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-log = "2"
image = "0.25"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

# Screen capture (Windows: DXGI/Windows.Graphics.Capture, macOS: ScreenCaptureKit/CoreGraphics, Linux: X11)
scap = "0.0.8"
# Cross-platform cursor move + wheel scroll injection (scrolling capture)
enigo = "0.2"
# Image clipboard support
arboard = "3"
# ffmpeg discovery / on-demand download / raw frame piping (MP4 + GIF encoding)
ffmpeg-sidecar = "1.1"

# scap 0.0.8's Windows engine targets windows-capture 1.3.6's 5-arg
# Settings::new, but its "1.3.6" req floats to 1.5.0 (8-arg) and breaks
# compilation. Vendored copy patches the two call sites for 1.5.0.
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "=1.5.0"
# GDI fallback capture + diagnostics (same version scap uses).
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

# Vendored scap: crates.io 0.0.8 plus a Windows-engine fix for
# windows-capture 1.5.0 (see vendor/scap/VENDORED.md).
[patch.crates-io]
scap = { path = "vendor/scap" }

[profile.release]
lto = true
strip = true
codegen-units = 1
