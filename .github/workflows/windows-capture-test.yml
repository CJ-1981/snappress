name: Windows capture test

# Runs the capture unit tests on a real Windows session: display enumeration,
# the Windows.Graphics.Capture session lifecycle and the GDI fallback.
on:
  workflow_dispatch:
  push:
    branches: [ci/windows-capture-test]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          prefix-key: rust-test-x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      # tauri-build embeds the frontend, so it has to exist before cargo runs.
      - name: Build frontend
        run: npm run ui:build

      - name: Run capture tests
        working-directory: src-tauri
        env:
          SNAPPRESS_TEST_REPORT: ${{ runner.temp }}/capture-test-report.txt
        run: |
          # cmd does the redirection: PowerShell turns native stderr into
          # error records, which its stop-on-error default would fail on.
          cmd /c 'cargo test --lib -- --nocapture --test-threads=1 > "%RUNNER_TEMP%\capture-test-output.txt" 2>&1'
          "cargo test exit code: $LASTEXITCODE"
          exit $LASTEXITCODE

      # Printed in a step of its own: the runner once dropped everything a
      # finished test binary wrote after its first line.
      - name: Show test output
        if: always()
        run: |
          "--- cargo test output ---"
          Get-Content "${env:RUNNER_TEMP}\capture-test-output.txt" -ErrorAction SilentlyContinue
          "--- report ---"
          Get-Content "${env:RUNNER_TEMP}\capture-test-report.txt" -ErrorAction SilentlyContinue

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-capture-test
          path: |
            ${{ runner.temp }}/capture-test-output.txt
            ${{ runner.temp }}/capture-test-report.txt
          if-no-files-found: warn
          retention-days: 14
